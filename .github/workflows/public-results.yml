name: Public result notebook

"on":
  pull_request:
    paths:
      - "notebooks/applications/results/**"
      - "scripts/render_public_lung_gallery.mjs"
      - "scripts/extract_public_lung_gallery.py"
      - "scripts/render_public_hspc_gallery.mjs"
      - "scripts/extract_public_hspc_gallery.py"
      - ".github/workflows/public-results.yml"
  push:
    branches: [main]
    paths:
      - "notebooks/applications/results/**"
      - "scripts/render_public_lung_gallery.mjs"
      - "scripts/extract_public_lung_gallery.py"
      - "scripts/render_public_hspc_gallery.mjs"
      - "scripts/extract_public_hspc_gallery.py"
      - ".github/workflows/public-results.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install lightweight notebook dependencies
        run: python -m pip install "pandas>=2.2,<4" nbformat nbclient ipykernel
      - name: Verify deterministic SVGs
        run: |
          node scripts/render_public_lung_gallery.mjs --check
          node scripts/render_public_hspc_gallery.mjs --check
      - name: Validate and execute the real-data results notebook
        run: |
          python -m py_compile scripts/extract_public_lung_gallery.py scripts/extract_public_hspc_gallery.py
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          import nbformat
          from nbclient import NotebookClient

          for dataset, name, count in [
              ("gse211713", "GSE211713_fibroblast_results.ipynb", 6),
              ("gse249479", "GSE249479_inflammation_results.ipynb", 5),
          ]:
              folder = Path("notebooks/applications/results", dataset).resolve()
              source = folder / name
              original = source.read_bytes()
              nb = nbformat.read(source, as_version=4)
              nbformat.validate(nb)
              svgs = list(folder.glob("figures/*.svg"))
              assert len(svgs) == count
              for svg in svgs:
                  ET.parse(svg)
              NotebookClient(nb, timeout=90, kernel_name="python3",
                             resources={"metadata": {"path": str(folder)}}).execute()
              assert not any(out.get("output_type") == "error" for cell in nb.cells
                             if cell.cell_type == "code" for out in cell.outputs)
              assert source.read_bytes() == original
              output = Path(os.environ["RUNNER_TEMP"]) / name.replace(".ipynb", ".executed.ipynb")
              nbformat.write(nb, output)
              print("PASS:", dataset, "executed all notebook code cells; original source untouched")
          PY
