<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 400" width="1050" height="400" role="img" aria-labelledby="title description"><title id="title">Directional continuity differs among fibroblasts</title><desc id="description">Three common-origin schematics preserve the control-to-early and control-to-late vector lengths and the estimated angle between them, not their original spatial coordinates.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="34" font-size="23" fill="#24384B" text-anchor="start" font-weight="600">Directional continuity differs among fibroblasts</text><text x="28" y="57" font-size="14" fill="#617486" text-anchor="start">Not observed trajectories or UMAP coordinates. All three panels share the same length scale.</text><rect x="30" y="76" width="13" height="10" fill="#3975A9" rx="2"/><text x="50" y="86" font-size="13" fill="#24384B" text-anchor="start">Control → early</text><rect x="230" y="76" width="13" height="10" fill="#D18B48" rx="2"/><text x="250" y="86" font-size="13" fill="#24384B" text-anchor="start">Control → late</text><text x="58" y="119" font-size="17" fill="#24384B" text-anchor="start" font-weight="600">Col13a1-like</text><line x1="58" y1="320" x2="111.584" y2="320" stroke="#3975A9" stroke-width="3"/><path d="M 102.579 324.35 L 111.584 320 L 102.579 315.65" fill="none" stroke="#3975A9" stroke-width="3" stroke-linecap="round"/><line x1="58" y1="320" x2="94.489" y2="141.754" stroke="#D18B48" stroke-width="3"/><path d="M 96.944 151.448 L 94.489 141.754 L 88.422 149.704" fill="none" stroke="#D18B48" stroke-width="3" stroke-linecap="round"/><circle cx="58" cy="320" r="4" fill="#24384B" stroke="white" stroke-width="1.4"/><path d="M 87 320 A 29 29 0 0 0 63.816 291.589" fill="none" stroke="#A2ACB7" stroke-width="1.5"/><text x="103" y="284" font-size="16" fill="#24384B" text-anchor="start" font-weight="600">78.4°</text><text x="58" y="343" font-size="12" fill="#617486" text-anchor="start">Control</text><text x="58" y="369" font-size="13" fill="#24384B" text-anchor="start">Early 2.55 · late 8.66</text><text x="404" y="119" font-size="17" fill="#24384B" text-anchor="start" font-weight="600">Col14a1-like</text><line x1="404" y1="320" x2="459.195" y2="320" stroke="#3975A9" stroke-width="3"/><path d="M 450.19 324.35 L 459.195 320 L 450.19 315.65" fill="none" stroke="#3975A9" stroke-width="3" stroke-linecap="round"/><line x1="404" y1="320" x2="525.059" y2="224.77" stroke="#D18B48" stroke-width="3"/><path d="M 520.671 233.756 L 525.059 224.77 L 515.293 226.919" fill="none" stroke="#D18B48" stroke-width="3" stroke-linecap="round"/><circle cx="404" cy="320" r="4" fill="#24384B" stroke="white" stroke-width="1.4"/><path d="M 433 320 A 29 29 0 0 0 426.793 302.07" fill="none" stroke="#A2ACB7" stroke-width="1.5"/><text x="449" y="284" font-size="16" fill="#24384B" text-anchor="start" font-weight="600">38.2°</text><text x="404" y="343" font-size="12" fill="#617486" text-anchor="start">Control</text><text x="404" y="369" font-size="13" fill="#24384B" text-anchor="start">Early 2.63 · late 7.33</text><text x="750" y="119" font-size="17" fill="#24384B" text-anchor="start" font-weight="600">Myofibroblast</text><line x1="750" y1="320" x2="821.737" y2="320" stroke="#3975A9" stroke-width="3"/><path d="M 812.732 324.35 L 821.737 320 L 812.732 315.65" fill="none" stroke="#3975A9" stroke-width="3" stroke-linecap="round"/><line x1="750" y1="320" x2="890.728" y2="204.806" stroke="#D18B48" stroke-width="3"/><path d="M 886.516 213.875 L 890.728 204.806 L 881.005 207.143" fill="none" stroke="#D18B48" stroke-width="3" stroke-linecap="round"/><circle cx="750" cy="320" r="4" fill="#24384B" stroke="white" stroke-width="1.4"/><path d="M 779 320 A 29 29 0 0 0 772.441 301.631" fill="none" stroke="#A2ACB7" stroke-width="1.5"/><text x="795" y="284" font-size="16" fill="#24384B" text-anchor="start" font-weight="600">39.3°</text><text x="750" y="343" font-size="12" fill="#617486" text-anchor="start">Control</text><text x="750" y="369" font-size="13" fill="#24384B" text-anchor="start">Early 3.42 · late 8.66</text><text x="1015" y="382" font-size="11" fill="#617486" text-anchor="end">Vector scale: 21 px / PCA unit</text></g></svg>
