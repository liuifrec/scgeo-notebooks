 r="5.5" fill="#D18B48" stroke="white" stroke-width="1.4"/><circle cx="693.985" cy="356" r="5.5" fill="#D18B48" stroke="white" stroke-width="1.4"/><text x="655" y="431" font-size="14" fill="#24384B" text-anchor="middle">Mouse projection along state-specific fitted axis (PCA units)</text><text x="28" y="455" font-size="12" fill="#617486" text-anchor="start">Points are public GEO mouse samples; lines show observed range, not confidence intervals. Separation is descriptive, not predictive validation.</text></g></svg>
