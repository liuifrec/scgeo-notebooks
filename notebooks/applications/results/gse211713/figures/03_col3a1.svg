<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 338" width="1060" height="338" role="img" aria-labelledby="title description"><title id="title">Col3a1: expression change is not geometric contribution</title><desc id="description">All three fibroblast populations show increased robust normalized expression for Col3a1 in the control-to-early contrast; two have negative signed contributions and one positive contribution.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="34" font-size="23" fill="#24384B" text-anchor="start" font-weight="600">Col3a1: expression change is not geometric contribution</text><text x="28" y="57" font-size="14" fill="#617486" text-anchor="start">Control → early • selected exploratory example • conditional sample-bootstrap intervals</text><text x="200" y="90" font-size="14" fill="#24384B" text-anchor="start" font-weight="600">Expression-center change</text><text x="600" y="90" font-size="14" fill="#24384B" text-anchor="start" font-weight="600">Signed geometric contribution</text><line x1="200" y1="105" x2="200" y2="257" stroke="#8999A6" stroke-width="1.4"/><text x="200" y="276" font-size="12" fill="#617486" text-anchor="middle">0</text><line x1="272.727" y1="105" x2="272.727" y2="257" stroke="#DDE5EA" stroke-width="1"/><text x="272.727" y="276" font-size="12" fill="#617486" text-anchor="middle">0.25</text><line x1="345.455" y1="105" x2="345.455" y2="257" stroke="#DDE5EA" stroke-width="1"/><text x="345.455" y="276" font-size="12" fill="#617486" text-anchor="middle">0.5</text><line x1="418.182" y1="105" x2="418.182" y2="257" stroke="#DDE5EA" stroke-width="1"/><text x="418.182" y="276" font-size="12" fill="#617486" text-anchor="middle">0.75</text><line x1="490.909" y1="105" x2="490.909" y2="257" stroke="#DDE5EA" stroke-width="1"/><text x="490.909" y="276" font-size="12" fill="#617486" text-anchor="middle">1</text><line x1="621.563" y1="105" x2="621.563" y2="257" stroke="#DDE5EA" stroke-width="1"/><text x="621.563" y="276" font-size="12" fill="#617486" text-anchor="middle">-0.05</text><line x1="729.375" y1="105" x2="729.375" y2="257" stroke="#8999A6" stroke-width="1.4"/><text x="729.375" y="276" font-size="12" fill="#617486" text-anchor="middle">0.00</text><line x1="837.188" y1="105" x2="837.188" y2="257" stroke="#DDE5EA" stroke-width="1"/><text x="837.188" y="276" font-size="12" fill="#617486" text-anchor="middle">0.05</text><line x1="945" y1="105" x2="945" y2="257" stroke="#DDE5EA" stroke-width="1"/><text x="945" y="276" font-size="12" fill="#617486" text-anchor="middle">0.10</text><text x="185" y="135" font-size="14" fill="#24384B" text-anchor="end" font-weight="600">Col13a1-like</text><rect x="200" y="124" width="59.333" height="12" fill="#7896AB" rx="2"/><text x="267.333" y="134" font-size="12" fill="#24384B" text-anchor="start">0.204</text><line x1="627.398" y1="130" x2="753.252" y2="130" stroke="#C27B48" stroke-width="2"/><line x1="627.398" y1="126" x2="627.398" y2="134" stroke="#C27B48" stroke-width="1.5"/><line x1="753.252" y1="126" x2="753.252" y2="134" stroke="#C27B48" stroke-width="1.5"/><circle cx="708.748" cy="130" r="5" fill="#C27B48" stroke="white" stroke-width="1.4"/><text x="1030" y="134" font-size="13" fill="#C27B48" text-anchor="end">-0.0096</text><text x="185" y="184" font-size="14" fill="#24384B" text-anchor="end" font-weight="600">Col14a1-like</text><rect x="200" y="173" width="147.833" height="12" fill="#7896AB" rx="2"/><text x="355.833" y="183" font-size="12" fill="#24384B" text-anchor="start">0.508</text><line x1="652.451" y1="179" x2="727.272" y2="179" stroke="#C27B48" stroke-width="2"/><line x1="652.451" y1="175" x2="652.451" y2="183" stroke="#C27B48" stroke-width="1.5"/><line x1="727.272" y1="175" x2="727.272" y2="183" stroke="#C27B48" stroke-width="1.5"/><circle cx="689.074" cy="179" r="5" fill="#C27B48" stroke="white" stroke-width="1.4"/><text x="1030" y="183" font-size="13" fill="#C27B48" text-anchor="end">-0.0187</text><text x="185" y="233" font-size="14" fill="#24384B" text-anchor="end" font-weight="600">Myofibroblast</text><rect x="200" y="222" width="270.211" height="12" fill="#7896AB" rx="2"/><text x="478.211" y="232" font-size="12" fill="#24384B" text-anchor="start">0.929</text><line x1="795.456" y1="228" x2="911.342" y2="228" stroke="#3975A9" stroke-width="2"/><line x1="795.456" y1="224" x2="795.456" y2="232" stroke="#3975A9" stroke-width="1.5"/><line x1="911.342" y1="224" x2="911.342" y2="232" stroke="#3975A9" stroke-width="1.5"/><circle cx="856.205" cy="228" r="5" fill="#3975A9" stroke="white" stroke-width="1.4"/><text x="1030" y="232" font-size="13" fill="#3975A9" text-anchor="end">0.0588</text><text x="28" y="316" font-size="12" fill="#617486" text-anchor="start">Contribution = robust expression-center change × axis loading. Interval includes zero for Col13a1-like; this is not a causal effect.</text></g></svg>
