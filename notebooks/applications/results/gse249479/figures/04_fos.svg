<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 388" width="1130" height="388" role="img" aria-labelledby="title description"><title id="title">FOS: the same expression-change sign, different contributions</title><desc id="description">FOS decreases in all six selected state-contrast rows, yet its small TNF contributions are negative while LPS contributions are positive.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="35" font-size="24" fill="#24384B" text-anchor="start" font-weight="600">FOS: the same expression-change sign, different contributions</text><text x="26" y="59" font-size="14" fill="#607386" text-anchor="start">Exploratory example • two separately scaled axes • no biological replicate intervals</text><rect x="26" y="74" width="13" height="11" fill="#3975A9" rx="2"/><text x="46" y="85" font-size="13" fill="#24384B" text-anchor="start">TNF</text><rect x="128" y="74" width="13" height="11" fill="#D18B48" rx="2"/><text x="148" y="85" font-size="13" fill="#24384B" text-anchor="start">LPS</text><text x="256" y="97" font-size="14" fill="#24384B" text-anchor="start" font-weight="600">Expression-center change</text><text x="680" y="97" font-size="14" fill="#24384B" text-anchor="start" font-weight="600">Signed contribution</text><line x1="256" y1="115" x2="256" y2="305" stroke="#DFE7EB" stroke-width="1"/><text x="256" y="326" font-size="12" fill="#607386" text-anchor="middle">-0.3</text><line x1="356" y1="115" x2="356" y2="305" stroke="#DFE7EB" stroke-width="1"/><text x="356" y="326" font-size="12" fill="#607386" text-anchor="middle">-0.2</text><line x1="456" y1="115" x2="456" y2="305" stroke="#DFE7EB" stroke-width="1"/><text x="456" y="326" font-size="12" fill="#607386" text-anchor="middle">-0.1</text><line x1="556" y1="115" x2="556" y2="305" stroke="#91A2AD" stroke-width="1.3"/><text x="556" y="326" font-size="12" fill="#607386" text-anchor="middle">0.0</text><line x1="695" y1="115" x2