ize="13" fill="#24384B" text-anchor="start">TNF 1.37 · LPS 1.88</text><text x="402" y="124" font-size="17" fill="#24384B" text-anchor="start" font-weight="600">Activated HSC</text><line x1="402" y1="324" x2="522.12" y2="324" stroke="#3975A9" stroke-width="3"/><path d="M 513.115 328.35 L 522.12 324 L 513.115 319.65" fill="none" stroke="#3975A9" stroke-width="3" stroke-linecap="round"/><line x1="402" y1="324" x2="468.083" y2="214.997" stroke="#D18B48" stroke-width="3"/><path d="M 467.134 224.952 L 468.083 214.997 L 459.695 220.442" fill="none" stroke="#D18B48" stroke-width="3" stroke-linecap="round"/><circle cx="402" cy="324" r="4" fill="#24384B" stroke="white" stroke-width="1.2"/><path d="M 429 324 A 27 27 0 0 0 415.997 300.912" fill="none" stroke="#99A9B5" stroke-width="1.5"/><text x="444" y="293" font-size="17" fill="#24384B" text-anchor="start" font-weight="600">58.8°</text><text x="402" y="347" font-size="12" fill="#607386" text-anchor="start">PBS</text><text x="402" y="372" font-size="13" fill="#24384B" text-anchor="start">TNF 2.67 · LPS 2.83</text><text x="752" y="124" font-size="17" fill="#24384B" text-anchor="start" font-weight="600">Lymphoid</text><line x1="752" y1="324" x2="938.376" y2="324" stroke="#3975A9" stroke-width="3"/><path d="M 929.372 328.35 L 938.376 324 L 929.372 319.65" fill="none" stroke="#3975A9" stroke-width="3" stroke-linecap="round"/><line x1="752" y1="324" x2="752.36" y2="156.085" stroke="#D18B48" stroke-width="3"/><path d="M 756.69 165.098 L 752.36 156.085 L 747.991 165.08" fill="none" stroke="#D18B48" stroke-width="3" stroke-linecap="round"/><circle cx="752" cy="324" r="4" fill="#24384B" stroke="white" stroke-width="1.2"/><path d="M 779 324 A 27 27 0 0 0 752.058 297" fill="none" stroke="#99A9B5" stroke-width="1.5"/><text x="794" y="293" font-size="17" fill="#24384B" text-anchor="start" font-weight="600">89.9°</text><text x="752" y="347" font-size="12" fill="#607386" text-anchor="start">PBS</text><text x="752" y="372" font-size="13" fill