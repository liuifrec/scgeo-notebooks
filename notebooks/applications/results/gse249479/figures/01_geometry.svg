<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 586" width="1160" height="586" role="img" aria-labelledby="title description"><title id="title">Distinct responses to TNF and LPS</title><desc id="description">Robust displacement magnitudes for seven human HSPC states under TNF and LPS relative to PBS, plus approximate directional cosines between the two shifts.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="26" y="35" font-size="24" fill="#24384B" text-anchor="start" font-weight="600">Distinct responses to TNF and LPS</text><text x="26" y="59" font-size="14" fill="#607386" text-anchor="start">GSE249479 • original verified SVD50 basis • pooled descriptive analysis only</text><rect x="252" y="75" width="13" height="11" fill="#3975A9" rx="2"/><text x="272" y="86" font-size="13" fill="#24384B" text-anchor="start">PBS → TNF</text><rect x="419" y="75" width="13" height="11" fill="#D18B48" rx="2"/><text x="439" y="86" font-size="13" fill="#24384B" text-anchor="start">PBS → LPS</text><text x="255" y="115" font-size="14" fill="#24384B" text-anchor="start" font-weight="600">Robust displacement magnitude</text><text x="785" y="115" font-size="14" fill="#24384B" text-anchor="start" font-weight="600">Directional cosine</text><line x1="255" y1="133" x2="255" y2="497" stroke="#91A2AD" stroke-width="1.3"/><text x="255" y="518" font-size="12" fill="#607386" text-anchor="middle">0</text><line x1="348.333" y1="133" x2="348.333" y2="497" stroke="#DFE7EB" stroke-width="1"/><text x="348.333" y="518" font-size="12" fill="#607386" text-anchor="middle">1</text><line x1="441.667" y1="133" x2="441.667" y2="497" stroke="#DFE7EB" stroke-width="1"/><text x="441.667" y="518" font-size="12" fill="#607386" text-anchor="middle">2</text><line x1="535" y1="133" x2="535" y2="497" stroke="#DFE7EB" stroke-width="1"/><text x="535" y="518" font-size="12" fill="#607386" text-anchor="middle">3</text><line x1="628.333" y1="133" x2="628.333"